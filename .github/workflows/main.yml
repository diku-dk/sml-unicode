name: CI

on:

  push:
    branches: [ master ]

  pull_request:
    branches: [ master ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:

  build-test:

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        mlcomp: [mlkit, mlton]

    runs-on: ${{ matrix.os }}

    steps:

      - uses: actions/checkout@v6

      - name: Setup environment
        run: |
          echo "OS=$(uname -s | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install smlpkg
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          install_dir="$RUNNER_TEMP/smlpkg-install"
          mkdir -p "$install_dir"
          gh release download --repo diku-dk/smlpkg \
            --pattern "smlpkg-bin-dist-$OS.tgz" --dir "$install_dir"
          tar -xzf "$install_dir/smlpkg-bin-dist-$OS.tgz" -C "$install_dir"
          make -C "$install_dir/smlpkg-bin-dist-$OS" install PREFIX="$HOME/.local"
          "$HOME/.local/bin/smlpkg" --version

      - name: Install MLKit
        if: ${{ matrix.mlcomp == 'mlkit' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          install_dir="$RUNNER_TEMP/mlkit-install"
          mkdir -p "$install_dir"
          gh release download --repo melsman/mlkit \
            --pattern "mlkit-bin-dist-$OS.tgz" --dir "$install_dir"
          tar -xzf "$install_dir/mlkit-bin-dist-$OS.tgz" -C "$install_dir"
          make -C "$install_dir/mlkit-bin-dist-$OS" install PREFIX="$HOME/.local"
          echo "SML_LIB=$HOME/.local/lib/mlkit" >> "$GITHUB_ENV"
          "$HOME/.local/bin/mlkit" --version

      - name: Install MLton (linux)
        if: ${{ env.OS == 'linux' && matrix.mlcomp == 'mlton' }}
        run: |
          sudo apt-get install -y mlton
          mlton

      - name: Install MLton (macos)
        if: ${{ env.OS == 'darwin' && matrix.mlcomp == 'mlton' }}
        run: |
          brew install mlton
          mlton

      - name: Build
        run: MLCOMP=${{ matrix.mlcomp }} make clean all

      - name: Run tests
        run: MLCOMP=${{ matrix.mlcomp }} make test
